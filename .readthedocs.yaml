# Configuration de build pour Read the Docs.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Ce fichier est à la racine du dépôt de documentation (dépôt séparé du
# projet Python-OC-Lettings-FR). Les chemins ci-dessous sont donc relatifs
# à ce dépôt, pas à celui du code.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: requirements.txt
